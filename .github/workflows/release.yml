# Сборка 2Dots: macOS dmg (arm64) и Windows nsis + portable (x64).
# На тег v* — ещё и GitHub Release с установщиками; вручную (workflow_dispatch) — только артефакты.
name: release

on:
  push:
    tags: ['v*']
    # Проверочная сборка (без релиза) при изменении конфигурации упаковки на ветках фаз (не main).
    # Нужна, пока release.yml не попал в main: до этого workflow_dispatch недоступен.
    # TODO: после слияния в main убрать этот триггер, оставив только теги v* и workflow_dispatch.
    branches: ['phase*/**']
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/electron.vite.config.ts
      - apps/desktop/build/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            artifact: 2dots-mac
            files: |
              apps/desktop/release/*.dmg
          - os: windows-latest
            dist: dist:win
            artifact: 2dots-win
            files: |
              apps/desktop/release/*.exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        # bash и на Windows: pwsh не прерывает многострочный run на упавшей команде.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Версия pnpm (12.x) берётся из packageManager в корневом package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm --filter @2dots/desktop test

      - name: Build installers
        run: pnpm ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
